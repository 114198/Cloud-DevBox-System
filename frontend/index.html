<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud DevBox - 云端开发环境</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-cube"></i>
                <span>Cloud DevBox</span>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        
        <nav class="sidebar-nav">
            <ul>
                <li class="active" data-page="dashboard">
                    <a href="#dashboard">
                        <i class="fas fa-home"></i>
                        <span>控制台</span>
                    </a>
                </li>
                <li data-page="environments">
                    <a href="#environments">
                        <i class="fas fa-server"></i>
                        <span>开发环境</span>
                    </a>
                </li>
                <li data-page="templates">
                    <a href="#templates">
                        <i class="fas fa-layer-group"></i>
                        <span>环境模板</span>
                    </a>
                </li>
                <li data-page="projects">
                    <a href="#projects">
                        <i class="fas fa-folder"></i>
                        <span>项目管理</span>
                    </a>
                </li>
                <li data-page="deployments">
                    <a href="#deployments">
                        <i class="fas fa-rocket"></i>
                        <span>部署管理</span>
                    </a>
                </li>
                <li data-page="collaboration">
                    <a href="#collaboration">
                        <i class="fas fa-users"></i>
                        <span>协作开发</span>
                    </a>
                </li>
                <li data-page="monitoring">
                    <a href="#monitoring">
                        <i class="fas fa-chart-line"></i>
                        <span>监控中心</span>
                    </a>
                </li>
                <li data-page="billing">
                    <a href="#billing">
                        <i class="fas fa-credit-card"></i>
                        <span>费用账单</span>
                    </a>
                </li>
                <li data-page="settings">
                    <a href="#settings">
                        <i class="fas fa-cog"></i>
                        <span>系统设置</span>
                    </a>
                </li>
            </ul>
        </nav>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="用户头像" class="avatar">
                <div class="user-details">
                    <span class="username">张三</span>
                    <span class="role">开发者</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 顶部导航 -->
        <header class="top-header">
            <div class="header-left">
                <div class="breadcrumb">
                    <span>首页</span>
                    <i class="fas fa-chevron-right"></i>
                    <span id="currentPageTitle">控制台</span>
                </div>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="搜索环境、项目...">
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" title="切换主题">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="icon-btn" title="通知">
                        <i class="fas fa-bell"></i>
                        <span class="badge">3</span>
                    </button>
                    <button class="icon-btn" title="帮助">
                        <i class="fas fa-question-circle"></i>
                    </button>
                    <div class="language-selector">
                        <select id="languageSelect">
                            <option value="zh-CN">简体中文</option>
                            <option value="en">English</option>
                            <option value="ja">日本語</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <!-- 页面内容容器 -->
        <div class="page-container" id="pageContainer">
            <!-- 控制台页面 -->
            <div class="page active" id="dashboardPage">
                <!-- 内容将通过JS加载 -->
            </div>
            
            <!-- 开发环境页面 -->
            <div class="page" id="environmentsPage">
                <!-- 内容将通过JS加载 -->
            </div>
            
            <!-- 环境模板页面 -->
            <div class="page" id="templatesPage">
                <!-- 内容将通过JS加载 -->
            </div>
            
            <!-- 项目管理页面 -->
            <div class="page" id="projectsPage">
                <!-- 内容将通过JS加载 -->
            </div>
            
            <!-- 部署管理页面 -->
            <div class="page" id="deploymentsPage">
                <!-- 内容将通过JS加载 -->
            </div>
            
            <!-- 协作开发页面 -->
            <div class="page" id="collaborationPage">
                <!-- 内容将通过JS加载 -->
            </div>
            
            <!-- 监控中心页面 -->
            <div class="page" id="monitoringPage">
                <!-- 内容将通过JS加载 -->
            </div>
            
            <!-- 费用账单页面 -->
            <div class="page" id="billingPage">
                <!-- 内容将通过JS加载 -->
            </div>
            
            <!-- 系统设置页面 -->
            <div class="page" id="settingsPage">
                <!-- 内容将通过JS加载 -->
            </div>
        </div>
    </main>

    <!-- 创建环境模态框 -->
    <div class="modal" id="createEnvModal">
        <div class="modal-overlay"></div>
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3>创建开发环境</h3>
                <button class="modal-close" onclick="closeModal('createEnvModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <!-- 步骤指示器 -->
                <div class="steps-indicator">
                    <div class="step active" data-step="1">
                        <div class="step-number">1</div>
                        <span>选择模板</span>
                    </div>
                    <div class="step" data-step="2">
                        <div class="step-number">2</div>
                        <span>配置资源</span>
                    </div>
                    <div class="step" data-step="3">
                        <div class="step-number">3</div>
                        <span>高级设置</span>
                    </div>
                    <div class="step" data-step="4">
                        <div class="step-number">4</div>
                        <span>确认创建</span>
                    </div>
                </div>
                
                <!-- 步骤内容 -->
                <div class="step-content" id="stepContent">
                    <!-- 步骤1: 选择模板 -->
                    <div class="step-panel active" data-step="1">
                        <div class="template-categories">
                            <button class="category-btn active" data-category="all">全部</button>
                            <button class="category-btn" data-category="frontend">前端</button>
                            <button class="category-btn" data-category="backend">后端</button>
                            <button class="category-btn" data-category="database">数据库</button>
                            <button class="category-btn" data-category="mobile">移动端</button>
                            <button class="category-btn" data-category="other">其他</button>
                        </div>
                        <div class="template-grid" id="templateGrid">
                            <!-- 模板卡片将通过JS加载 -->
                        </div>
                    </div>
                    
                    <!-- 步骤2: 配置资源 -->
                    <div class="step-panel" data-step="2">
                        <div class="form-group">
                            <label>环境名称</label>
                            <input type="text" id="envName" placeholder="输入环境名称" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>CPU 配置</label>
                            <div class="resource-options" id="cpuOptions">
                                <button class="resource-btn" data-value="0.5">0.5核</button>
                                <button class="resource-btn active" data-value="1">1核</button>
                                <button class="resource-btn" data-value="2">2核</button>
                                <button class="resource-btn" data-value="4">4核</button>
                                <button class="resource-btn" data-value="8">8核</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>内存配置</label>
                            <div class="resource-options" id="memoryOptions">
                                <button class="resource-btn" data-value="1">1GB</button>
                                <button class="resource-btn active" data-value="2">2GB</button>
                                <button class="resource-btn" data-value="4">4GB</button>
                                <button class="resource-btn" data-value="8">8GB</button>
                                <button class="resource-btn" data-value="16">16GB</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>存储配置</label>
                            <div class="resource-options" id="storageOptions">
                                <button class="resource-btn" data-value="10">10GB</button>
                                <button class="resource-btn active" data-value="20">20GB</button>
                                <button class="resource-btn" data-value="50">50GB</button>
                                <button class="resource-btn" data-value="100">100GB</button>
                                <button class="resource-btn" data-value="200">200GB</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 步骤3: 高级设置 -->
                    <div class="step-panel" data-step="3">
                        <div class="form-group">
                            <label>Git 仓库 (可选)</label>
                            <input type="text" id="gitRepo" placeholder="https://github.com/username/repo.git" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>环境变量</label>
                            <div class="env-vars" id="envVars">
                                <div class="env-var-row">
                                    <input type="text" placeholder="KEY" class="form-input">
                                    <input type="text" placeholder="VALUE" class="form-input">
                                    <button class="btn-icon" onclick="removeEnvVar(this)"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                            <button class="btn btn-outline btn-sm" onclick="addEnvVar()">
                                <i class="fas fa-plus"></i> 添加变量
                            </button>
                        </div>
                        <div class="form-group">
                            <label>端口映射</label>
                            <div class="port-mappings" id="portMappings">
                                <div class="port-row">
                                    <input type="number" placeholder="容器端口" class="form-input" value="3000">
                                    <span>→</span>
                                    <input type="number" placeholder="外部端口" class="form-input" value="80">
                                    <button class="btn-icon" onclick="removePort(this)"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                            <button class="btn btn-outline btn-sm" onclick="addPort()">
                                <i class="fas fa-plus"></i> 添加端口
                            </button>
                        </div>
                    </div>
                    
                    <!-- 步骤4: 确认创建 -->
                    <div class="step-panel" data-step="4">
                        <div class="confirm-summary">
                            <h4>配置摘要</h4>
                            <div class="summary-item">
                                <span class="label">模板:</span>
                                <span class="value" id="summaryTemplate">Node.js</span>
                            </div>
                            <div class="summary-item">
                                <span class="label">环境名称:</span>
                                <span class="value" id="summaryName">my-project</span>
                            </div>
                            <div class="summary-item">
                                <span class="label">CPU:</span>
                                <span class="value" id="summaryCpu">1核</span>
                            </div>
                            <div class="summary-item">
                                <span class="label">内存:</span>
                                <span class="value" id="summaryMemory">2GB</span>
                            </div>
                            <div class="summary-item">
                                <span class="label">存储:</span>
                                <span class="value" id="summaryStorage">20GB</span>
                            </div>
                            <div class="summary-item">
                                <span class="label">预估费用:</span>
                                <span class="value price" id="summaryPrice">¥0.25/小时</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="prevStepBtn" onclick="prevStep()" style="display:none">上一步</button>
                <button class="btn btn-primary" id="nextStepBtn" onclick="nextStep()">下一步</button>
                <button class="btn btn-success" id="createEnvBtn" onclick="createEnvironment()" style="display:none">创建环境</button>
            </div>
        </div>
    </div>

    <!-- 环境详情模态框 -->
    <div class="modal" id="envDetailModal">
        <div class="modal-overlay"></div>
        <div class="modal-content modal-xl">
            <div class="modal-header">
                <h3>环境详情</h3>
                <button class="modal-close" onclick="closeModal('envDetailModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="envDetailContent">
                <!-- 内容将通过JS加载 -->
            </div>
        </div>
    </div>

    <!-- 通知提示 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 加载脚本 -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/environments.js"></script>
    <script src="js/pages/templates.js"></script>
    <script src="js/pages/projects.js"></script>
    <script src="js/pages/deployments.js"></script>
    <script src="js/pages/collaboration.js"></script>
    <script src="js/pages/monitoring.js"></script>
    <script src="js/pages/billing.js"></script>
    <script src="js/pages/settings.js"></script>
</body>
</html>
