[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clouddevbox"
version = "1.0.0"
description = "Cloud DevBox Python SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Cloud DevBox Team", email = "support@clouddevbox.io" }
]
keywords = ["clouddevbox", "devbox", "cloud", "development", "environment", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://clouddevbox.io"
Documentation = "https://docs.clouddevbox.io/sdk/python"
Repository = "https://github.com/clouddevbox/sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["clouddevbox"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
