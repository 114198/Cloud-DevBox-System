# DevBox Custom Resource Definition
# Defines the schema for DevBox resources in Kubernetes
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devboxes.devbox.clouddevbox.io
  annotations:
    description: "DevBox is a cloud-native development environment"
spec:
  group: devbox.clouddevbox.io
  names:
    kind: DevBox
    listKind: DevBoxList
    plural: devboxes
    singular: devbox
    shortNames:
      - db
      - dbox
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - templateId
                - userId
              properties:
                templateId:
                  type: string
                  description: "ID of the template to use for this DevBox"
                userId:
                  type: string
                  description: "ID of the user who owns this DevBox"
                name:
                  type: string
                  description: "Human-readable name for the DevBox"
                  maxLength: 255
                description:
                  type: string
                  description: "Description of the DevBox"
                resources:
                  type: object
                  description: "Resource allocation for the DevBox"
                  properties:
                    cpu:
                      type: string
                      description: "CPU allocation (e.g., '1', '2', '0.5')"
                      pattern: "^[0-9]+(\\.[0-9]+)?$"
                    memory:
                      type: string
                      description: "Memory allocation (e.g., '1Gi', '2Gi')"
                      pattern: "^[0-9]+(\\.[0-9]+)?(Mi|Gi)$"
                    storage:
                      type: string
                      description: "Storage allocation (e.g., '10Gi', '50Gi')"
                      pattern: "^[0-9]+(\\.[0-9]+)?(Mi|Gi)$"
                runtime:
                  type: object
                  description: "Runtime configuration"
                  properties:
                    image:
                      type: string
                      description: "Container image to use"
                    command:
                      type: array
                      items:
                        type: string
                      description: "Command to run in the container"
                    args:
                      type: array
                      items:
                        type: string
                      description: "Arguments for the command"
                    workingDir:
                      type: string
                      description: "Working directory in the container"
                environment:
                  type: array
                  description: "Environment variables"
                  items:
                    type: object
                    required:
                      - name
                      - value
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                ports:
                  type: array
                  description: "Port mappings"
                  items:
                    type: object
                    required:
                      - containerPort
                    properties:
                      name:
                        type: string
                      containerPort:
                        type: integer
                        minimum: 1
                        maximum: 65535
                      protocol:
                        type: string
                        enum:
                          - TCP
                          - UDP
                        default: TCP
                volumes:
                  type: array
                  description: "Volume mounts"
                  items:
                    type: object
                    required:
                      - name
                      - mountPath
                    properties:
                      name:
                        type: string
                      mountPath:
                        type: string
                      subPath:
                        type: string
                      readOnly:
                        type: boolean
                        default: false
                ssh:
                  type: object
                  description: "SSH configuration"
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    port:
                      type: integer
                      default: 22
                    publicKey:
                      type: string
                      description: "SSH public key for authentication"
                autoStop:
                  type: object
                  description: "Auto-stop configuration"
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    inactivityTimeout:
                      type: string
                      description: "Duration of inactivity before auto-stop (e.g., '72h')"
                      default: "72h"
                autoDelete:
                  type: object
                  description: "Auto-delete configuration"
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    stoppedTimeout:
                      type: string
                      description: "Duration after stop before auto-delete (e.g., '168h' for 7 days)"
                      default: "168h"
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Current phase of the DevBox"
                  enum:
                    - Creating
                    - Running
                    - Stopped
                    - Failed
                    - Suspended
                    - Deleting
                message:
                  type: string
                  description: "Human-readable message about the current status"
                podName:
                  type: string
                  description: "Name of the underlying Pod"
                podIP:
                  type: string
                  description: "Internal IP address of the Pod"
                externalIP:
                  type: string
                  description: "External IP address for access"
                sshPort:
                  type: integer
                  description: "External SSH port"
                webPorts:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      port:
                        type: integer
                      externalPort:
                        type: integer
                      url:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                resourceUsage:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    storage:
                      type: string
                lastActivityTime:
                  type: string
                  format: date-time
                  description: "Last time the DevBox was accessed"
                createdAt:
                  type: string
                  format: date-time
                startedAt:
                  type: string
                  format: date-time
                stoppedAt:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: User
          type: string
          jsonPath: .spec.userId
        - name: Template
          type: string
          jsonPath: .spec.templateId
        - name: Pod IP
          type: string
          jsonPath: .status.podIP
        - name: SSH Port
          type: integer
          jsonPath: .status.sshPort
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
