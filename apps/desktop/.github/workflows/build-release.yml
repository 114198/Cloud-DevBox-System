# Cloud DevBox Desktop Release Workflow
# Builds and releases desktop clients for Windows, macOS, and Linux

name: Build and Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.1.0'

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  # Build for Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build frontend
        run: npm run build
        working-directory: apps/web

      - name: Build Tauri (MSI)
        run: cargo tauri build --bundles msi
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri (NSIS)
        run: cargo tauri build --bundles nsis
        working-directory: apps/desktop

      - name: Sign Windows artifacts
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          pwsh -File scripts/sign-windows.ps1 -FilePath "target/release/bundle/msi/*.msi"
          pwsh -File scripts/sign-windows.ps1 -FilePath "target/release/bundle/nsis/*.exe"
        working-directory: apps/desktop
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            apps/desktop/target/release/bundle/msi/*.msi
            apps/desktop/target/release/bundle/nsis/*.exe

  # Build for macOS (Universal Binary)
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build frontend
        run: npm run build
        working-directory: apps/web

      - name: Build Tauri (arm64)
        run: cargo tauri build --target aarch64-apple-darwin --bundles app
        working-directory: apps/desktop

      - name: Build Tauri (x86_64)
        run: cargo tauri build --target x86_64-apple-darwin --bundles app
        working-directory: apps/desktop

      - name: Create Universal Binary
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh --skip-frontend --skip-sign --skip-notarize
        working-directory: apps/desktop

      - name: Import Apple certificates
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          rm certificate.p12

      - name: Sign and Notarize
        if: env.APPLE_ID != ''
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh --skip-frontend --arch universal
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            apps/desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  # Build for Linux
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build frontend
        run: npm run build
        working-directory: apps/web

      - name: Build Tauri (AppImage)
        run: cargo tauri build --bundles appimage
        working-directory: apps/desktop

      - name: Build Tauri (DEB)
        run: cargo tauri build --bundles deb
        working-directory: apps/desktop

      - name: Build Tauri (RPM)
        run: cargo tauri build --bundles rpm
        working-directory: apps/desktop

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            apps/desktop/target/release/bundle/appimage/*.AppImage
            apps/desktop/target/release/bundle/deb/*.deb
            apps/desktop/target/release/bundle/rpm/*.rpm

  # Create GitHub Release
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec sha256sum {} \; > checksums.sha256
          cat checksums.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Update release server
  update-release-server:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Update release manifest
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Updating release manifest for version $VERSION"
          # Add your release server update logic here
          # e.g., update S3 bucket, CDN, etc.
