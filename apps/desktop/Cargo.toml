[package]
name = "devbox-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.0.0-beta", features = [] }

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
config.workspace = true
uuid.workspace = true
chrono.workspace = true

devbox-shared = { path = "../../packages/shared" }

# Tauri core and plugins
tauri = { version = "2.0.0-beta", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0.0-beta"
tauri-plugin-notification = "2.0.0-beta"
tauri-plugin-dialog = "2.0.0-beta"
tauri-plugin-process = "2.0.0-beta"
tauri-plugin-updater = "2.0.0-beta"
tauri-plugin-autostart = "2.0.0-beta"
tauri-plugin-global-shortcut = "2.0.0-beta"
tauri-plugin-store = "2.0.0-beta"
tauri-plugin-os = "2.0.0-beta"

# Keyring for secure credential storage
keyring = "2.3"

# SSH client
russh = "0.43"
russh-keys = "0.43"

# Async utilities
futures = "0.3"
async-trait.workspace = true

# Directories for config storage
dirs = "5.0"

[dev-dependencies]
mockall.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
