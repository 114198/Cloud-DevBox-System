name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: devbox

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          # Linux x64 (musl - static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # macOS x64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # macOS ARM64
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        working-directory: apps/cli
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: '!matrix.cross'
        working-directory: apps/cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/cli-v}" >> $GITHUB_OUTPUT
          fi

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ env.BINARY_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ env.BINARY_NAME }}.exe -DestinationPath ../../../${{ env.BINARY_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/cli-v}" >> $GITHUB_OUTPUT
          fi

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: DevBox CLI v${{ steps.version.outputs.version }}
          tag_name: cli-v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
          body: |
            ## DevBox CLI v${{ steps.version.outputs.version }}
            
            ### Installation
            
            **macOS (Homebrew)**
            ```bash
            brew install cloud-devbox/tap/devbox
            ```
            
            **Windows (Scoop)**
            ```powershell
            scoop bucket add devbox https://github.com/your-org/scoop-bucket
            scoop install devbox
            ```
            
            **Linux (Debian/Ubuntu)**
            ```bash
            curl -LO https://github.com/your-org/cloud-devbox/releases/download/cli-v${{ steps.version.outputs.version }}/devbox-cli_${{ steps.version.outputs.version }}_amd64.deb
            sudo dpkg -i devbox-cli_${{ steps.version.outputs.version }}_amd64.deb
            ```
            
            **Manual Download**
            Download the appropriate binary for your platform from the assets below.
            
            ### Checksums
            See `checksums.txt` for SHA256 checksums of all binaries.

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: your-org/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/cli-v}" >> $GITHUB_OUTPUT
          fi

      - name: Download checksums
        run: |
          curl -LO https://github.com/your-org/cloud-devbox/releases/download/cli-v${{ steps.version.outputs.version }}/checksums.txt

      - name: Update formula
        run: |
          VERSION=${{ steps.version.outputs.version }}
          
          # Extract SHA256 hashes
          MACOS_X64_SHA=$(grep "x86_64-apple-darwin" checksums.txt | cut -d' ' -f1)
          MACOS_ARM64_SHA=$(grep "aarch64-apple-darwin" checksums.txt | cut -d' ' -f1)
          LINUX_X64_SHA=$(grep "x86_64-unknown-linux-gnu" checksums.txt | cut -d' ' -f1)
          LINUX_ARM64_SHA=$(grep "aarch64-unknown-linux-gnu" checksums.txt | cut -d' ' -f1)
          
          # Update formula
          cd homebrew-tap
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/devbox.rb
          sed -i "s/PLACEHOLDER_SHA256_MACOS_X64/${MACOS_X64_SHA}/" Formula/devbox.rb
          sed -i "s/PLACEHOLDER_SHA256_MACOS_ARM64/${MACOS_ARM64_SHA}/" Formula/devbox.rb
          sed -i "s/PLACEHOLDER_SHA256_LINUX_X64/${LINUX_X64_SHA}/" Formula/devbox.rb
          sed -i "s/PLACEHOLDER_SHA256_LINUX_ARM64/${LINUX_ARM64_SHA}/" Formula/devbox.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/devbox.rb
          git commit -m "Update devbox to v${{ steps.version.outputs.version }}"
          git push
